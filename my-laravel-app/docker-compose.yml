networks:
  default:
    external: true
    name: mainNetwork

services:
  nginx:
    image: nginx:stable
    container_name: win-App
    ports:
      - "8344:80"
    volumes:
      - .:/var/www/win/my-laravel-app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: win-PHP
    volumes:
      - .:/var/www/win/my-laravel-app
      #- ./docker/php-fpm/www.conf:/usr/local/etc/php/conf.d/www.conf
      - ./docker/local.ini:/usr/local/etc/php/conf.d/local.ini
    restart: always
